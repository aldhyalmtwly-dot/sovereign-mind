<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>النظام السيادي · ثروت البهي</title>
<style>
:root { --gold:#ffd700; --cyan:#00ffcc; --red:#ff0055; --green:#00ff88; --bg:#000; --dim:#555; }
* { -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
body { background:var(--bg); color:var(--cyan); font-family:'Courier New',monospace;
  margin:0; padding:10px; min-height:100vh; display:flex; align-items:center;
  justify-content:center; user-select:none; -webkit-user-select:none; overflow-x:hidden; }
.screen { display:none; width:100%; max-width:480px; }
.screen.active { display:block; animation:fadeIn .3s; }
@keyframes fadeIn { from{opacity:0;transform:scale(.98);} to{opacity:1;transform:scale(1);} }
.box { border:2px solid var(--gold); border-radius:12px; padding:18px;
  background:#050505; box-shadow:0 0 50px rgba(255,215,0,.15); }
h1, h2 { color:var(--gold); text-shadow:0 0 15px var(--gold);
  text-align:center; margin:0 0 4px; font-size:20px; }
.subtitle { color:var(--dim); font-size:10px; text-align:center;
  letter-spacing:2px; margin-bottom:14px; }

.hw-panel { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; margin-bottom:12px; }
.hw-item { background:#080808; border:1px solid #222; border-radius:5px; padding:6px 3px; text-align:center; }
.hw-label { font-size:8px; color:var(--dim); }
.hw-val { font-size:11px; color:var(--cyan); font-weight:bold; margin-top:2px; min-height:14px; }

.btn { width:100%; background:transparent; color:var(--gold); border:2px solid var(--gold);
  padding:12px; font-size:14px; font-weight:bold; border-radius:8px; cursor:pointer;
  font-family:inherit; margin-top:6px; transition:.3s; }
.btn:active:not(:disabled) { background:var(--gold); color:#000; }
.btn:disabled { opacity:.4; }
.btn-red { border-color:var(--red); color:var(--red); }
.btn-red:active { background:var(--red); color:#000; }
.btn-cyan { border-color:var(--cyan); color:var(--cyan); }
.btn-cyan:active { background:var(--cyan); color:#000; }

.cmd-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.cmd-btn { background:#0a0a0a; border:1px solid #333; color:var(--cyan); padding:10px;
  font-size:11px; border-radius:6px; cursor:pointer; font-family:inherit; transition:.2s; }
.cmd-btn:active { background:var(--cyan); color:#000; }
.cmd-btn.gold { border-color:var(--gold); color:var(--gold); }
.cmd-btn.gold:active { background:var(--gold); color:#000; }
.cmd-btn.red { border-color:var(--red); color:var(--red); }
.cmd-btn.red:active { background:var(--red); color:#000; }

.log { background:#000; border:1px solid #222; height:150px; overflow-y:auto;
  padding:6px; font-size:9px; text-align:left; border-radius:5px;
  margin-top:10px; line-height:1.5; font-family:monospace; color:var(--cyan); }
.log .l-ok { color:var(--green); }
.log .l-err { color:var(--red); }
.log .l-gold { color:var(--gold); }

.input-pin { width:100%; background:#000; border:1px solid #333; color:var(--cyan);
  padding:12px; font-size:18px; text-align:center; border-radius:8px;
  font-family:inherit; outline:none; margin-bottom:8px; letter-spacing:4px; }
.input-pin:focus { border-color:var(--cyan); }
.footer { text-align:center; color:#333; font-size:8px; margin-top:10px; letter-spacing:1px; }
</style>
</head>
<body>

<div class="screen active" id="mainScreen">
  <div class="box">
    <h1>النظام السيادي</h1>
    <div class="subtitle">المدير: ثروت محمد البهي</div>
    
    <div class="hw-panel">
      <div class="hw-item"><div class="hw-label">الأنوية</div><div class="hw-val" id="hw-cores">-</div></div>
      <div class="hw-item"><div class="hw-label">البطارية</div><div class="hw-val" id="hw-bat">-</div></div>
      <div class="hw-item"><div class="hw-label">الشبكة</div><div class="hw-val" id="hw-net">-</div></div>
      <div class="hw-item"><div class="hw-label">الذاكرة</div><div class="hw-val" id="hw-ram">-</div></div>
    </div>

    <div class="cmd-grid">
      <button class="cmd-btn cyan" onclick="vibrate([50,30,50])">اهتزاز</button>
      <button class="cmd-btn cyan" onclick="cmdFullScreen()">ملء الشاشة</button>
      <button class="cmd-btn gold" onclick="cmdWakeLock()">منع النوم</button>
      <button class="cmd-btn" onclick="cmdPing()">فحص الشبكة</button>
      <button class="cmd-btn" onclick="cmdLocation()">الموقع</button>
      <button class="cmd-btn" onclick="cmdBatteryInfo()">بيانات البطارية</button>
      
      <button class="cmd-btn gold" onclick="cmdMultiplyCores()">التضاعف السيادي</button>
      <button class="cmd-btn red" onclick="cmdReturnToCore()">معادلة العودة للأصل</button>
      
      <button class="cmd-btn red" onclick="cmdClearLog()" style="grid-column: span 2;">مسح السجل</button>
    </div>

    <div class="log" id="log">> النظام السيادي جاهز<br></div>
    
    <button class="btn btn-cyan" onclick="runDiagnostics()">تشغيل التشخيص الحي</button>
    <button class="btn btn-red" onclick="lockSystem()">قفل النظام</button>
    <div class="footer">SOVEREIGN · T.M.B · LIVE COMMAND · 2026</div>
  </div>
</div>

<div class="screen" id="lockScreen">
  <div class="box">
    <h2>النظام مقفل</h2>
    <div class="subtitle">أدخل مفتاح الدخول</div>
    <input type="password" class="input-pin" id="lockPin" placeholder="••••" maxlength="6" inputmode="numeric">
    <button class="btn" onclick="tryUnlock()">دخول سيادي</button>
    <div class="log" style="height:60px;" id="lockLog">> بانتظار المفتاح...</div>
  </div>
</div>

<script>
const SYSTEM_KEY = "7777"; 
let wakeLock = null;

function addLog(msg, type = '') {
  const log = document.getElementById('log');
  if (!log) return;
  const time = new Date().toLocaleTimeString('en-GB');
  const line = document.createElement('div');
  line.className = type ? 'l-' + type : '';
  line.textContent = `[${time}] ${msg}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function vibrate(pattern) {
  if (navigator.vibrate) {
    navigator.vibrate(pattern);
    addLog('اهتزاز: ' + JSON.stringify(pattern), 'ok');
  }
}

async function updateHardware() {
  const cores = navigator.hardwareConcurrency || '?';
  document.getElementById('hw-cores').textContent = cores;

  if (navigator.getBattery) {
    try {
      const bat = await navigator.getBattery();
      const pct = Math.round(bat.level * 100);
      document.getElementById('hw-bat').textContent = pct + '%';
      document.getElementById('hw-bat').style.color = pct < 20 ? 'var(--red)' : 'var(--cyan)';
    } catch(e) { document.getElementById('hw-bat').textContent = 'N/A'; }
  }

  const online = navigator.onLine;
  const netEl = document.getElementById('hw-net');
  netEl.textContent = online ? 'ON' : 'OFF';
  netEl.style.color = online ? 'var(--green)' : 'var(--red)';
  
  if (navigator.connection) {
    netEl.textContent = online ? (navigator.connection.effectiveType || 'ON').toUpperCase() : 'OFF';
  }

  if (navigator.deviceMemory) {
    document.getElementById('hw-ram').textContent = navigator.deviceMemory + 'GB';
  } else if (performance.memory) {
    document.getElementById('hw-ram').textContent = Math.round(performance.memory.usedJSHeapSize / 1048576) + 'MB';
  }
}

setInterval(updateHardware, 2000);

async function cmdFullScreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
      addLog('ملء الشاشة: مُفعّل', 'ok');
    } else {
      await document.exitFullscreen();
      addLog('ملء الشاشة: مُلغى', 'ok');
    }
  } catch(e) { addLog('فشل ملء الشاشة', 'err'); }
}

async function cmdWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
        addLog('منع النوم: مُلغى', 'ok');
      } else {
        wakeLock = await navigator.wakeLock.request('screen');
        addLog('منع النوم: مُفعّل', 'ok');
      }
    }
  } catch(e) { addLog('فشل Wake Lock', 'err'); }
}

async function cmdPing() {
  addLog('جارٍ فحص الشبكة...', 'gold');
  const start = performance.now();
  try {
    await fetch('https://www.google.com/favicon.ico?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' });
    addLog(`الاتصال: ناجح | التأخير: ${Math.round(performance.now() - start)}ms`, 'ok');
    vibrate(30);
  } catch(e) {
    addLog('الاتصال: فشل', 'err');
  }
}

function cmdLocation() {
  if (!navigator.geolocation) { addLog('الموقع غير مدعوم', 'err'); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => addLog(`الموقع: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`, 'ok'),
    (err) => addLog('فشل الموقع: ' + err.message, 'err'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function cmdBatteryInfo() {
  if (!navigator.getBattery) { addLog('بيانات البطارية غير مدعومة', 'err'); return; }
  const bat = await navigator.getBattery();
  addLog(`البطارية: ${Math.round(bat.level*100)}% | الشحن: ${bat.charging ? 'نعم' : 'لا'}`, 'ok');
}

function cmdClearLog() {
  document.getElementById('log').innerHTML = '> السجل مُفرّغ<br>';
}

// ═══ التضاعف السيادي (BigInt) ═══
function cmdMultiplyCores() {
  const cores = navigator.hardwareConcurrency || 8;
  let result = BigInt(cores);
  
  addLog(`> الأنوية الأساسية: ${cores}`, 'ok');
  
  const multipliers = [9n, 9n, 99n, 999n, 999000n, 99999n, 1000999n, 999000000000n, 1999000000n]; 
  const names = ["× 9", "× 9", "× 99", "× 999", "× 999,000", "× 99,999", "× 1,000,999", "× 999 مليار", "× 1.999 مليار"];
  
  addLog("> بدء التضاعف السيادي...", 'gold');
  
  for (let i = 0; i < multipliers.length; i++) {
    result = result * multipliers[i];
    let displayValue = result > 1000000000000n ? result.toString().substring(0,6) + '... (رقم فلكي)' : result.toLocaleString('en-US');
    addLog(`${names[i]} = ${displayValue}`, 'cyan');
  }
  
  addLog(`النتيجة النهائية: ${result.toLocaleString('en-US')}`, 'gold');
  
  // حفظ الرقم الفلكي، وحفظ معامل الضرب الكلي للعودة الدقيقة
  window._massiveNumber = result; 
  window._totalMultiplier = result / BigInt(cores); 
  
  vibrate([50, 30, 50, 30, 100]);
}

// ═══ معادلة العودة للأصل (التصحيح الرياضي) ═══
function cmdReturnToCore() {
  addLog("> بدء معادلة العودة للأصل...", 'gold');
  
  const cores = navigator.hardwareConcurrency || 8;
  
  if (!window._massiveNumber || !window._totalMultiplier) {
    addLog("الرجاء تشغيل 'التضاعف السيادي' أولاً.", 'err');
    vibrate([100,50,100]);
    return;
  }
  
  addLog(`المعادلة: (${window._massiveNumber.toString().substring(0,10)}...) ÷ (المعامل الكلي)`, 'cyan');
  
  // القسمة على المعامل الكلي للعودة الدقيقة إلى الأنوية الأصلية
  let finalResult = window._massiveNumber / window._totalMultiplier;
  
  addLog(`النتيجة النهائية: ${finalResult.toLocaleString('en-US')}`, 'green');
  
  if (finalResult === BigInt(cores)) {
    addLog('✓ عاد النظام إلى نواته الأصلية', 'gold');
    vibrate([200, 100, 200]);
  } else {
    addLog('⚠ حدث خطأ في الحسابات', 'err');
    vibrate([100, 50, 100]);
  }
}

async function runDiagnostics() {
  cmdClearLog();
  addLog('═══ بدء التشخيص السيادي ═══', 'gold');
  addLog(`[1] المعالج: ${navigator.hardwareConcurrency || '?'} نواة`, 'ok');
  vibrate(20); await new Promise(r => setTimeout(r, 300));
  
  if (navigator.getBattery) {
    const bat = await navigator.getBattery();
    addLog(`[2] البطارية: ${Math.round(bat.level*100)}% ${bat.charging ? '⚡' : ''}`, 'ok');
  }
  vibrate(20); await new Promise(r => setTimeout(r, 300));
  
  addLog(`[3] الشبكة: ${navigator.onLine ? 'متصل' : 'مقطوع'}`, navigator.onLine ? 'ok' : 'err');
  vibrate(20); await new Promise(r => setTimeout(r, 300));
  
  addLog(`[4] المنصة: ${navigator.platform}`, 'ok');
  vibrate(20); await new Promise(r => setTimeout(r, 300));

  addLog(`[5] الذاكرة: ${navigator.deviceMemory || '?'}GB`, 'ok');
  vibrate(20);
  
  addLog('═══ اكتمل التشخيص ✓ ═══', 'gold');
  vibrate([50, 30, 50, 30, 100]);
}

function lockSystem() {
  document.getElementById('mainScreen').classList.remove('active');
  document.getElementById('lockScreen').classList.add('active');
  document.getElementById('lockPin').value = '';
  document.getElementById('lockLog').innerHTML = '> بانتظار المفتاح...';
  vibrate(100);
}

function tryUnlock() {
  const pin = document.getElementById('lockPin').value;
  if (pin === SYSTEM_KEY) {
    document.getElementById('lockScreen').classList.remove('active');
    document.getElementById('mainScreen').classList.add('active');
    addLog('النظام: مفتوح ✓', 'ok');
    vibrate([20, 40, 20]);
  } else {
    document.getElementById('lockLog').innerHTML = '<span class="l-err">> مفتاح خاطئ ✗</span>';
    vibrate([150, 50, 150]);
    document.getElementById('lockPin').value = '';
  }
}

// دالة الدخول التلقائي عند الضغط على Enter
document.getElementById('lockPin').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    tryUnlock();
  }
});

window.onload = () => {
  updateHardware();
  addLog('النواة السيادية: مُحمّلة', 'gold');
  addLog('النظام جاهز للأوامر', 'ok');
  vibrate(30);
};
</script>
</body>
</html>
